name: "CI: sdk-go"

on:
  push:
    branches: [main]
    paths:
      - "sdk/go/**"
      - "cross-sdk-tests/**"
      - "spec/**"
  pull_request:
    branches: [main]
    paths:
      - "sdk/go/**"
      - "cross-sdk-tests/**"
      - "spec/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      - name: Integration tests
        run: go test -tags=integration ./... -v
