name: Site (obsigna.dev)

on:
  push:
    branches: [main]
    # The blog source of truth lives in site/; sync-blog.mjs mirrors it into
    # this site at build time. Without site/blog paths here, a blog-only edit
    # never retriggers an obsigna.dev rebuild, leaving the mirror stale.
    # The /verify WASM verifier is built from the Go core (sdk/go) plus the
    # web-verifier module and build script, so a change to any of those must
    # redeploy obsigna.dev to keep the binary fresh.
    paths: [site-obsigna/**, site/src/content/docs/blog/**, site/public/blog/**, sdk/go/**, sdk/ts/**, sdk/py/**, mcp-proxy/**, hook/**, web-verifier/**, scripts/build-verify-wasm.sh]
  pull_request:
    branches: [main]
    paths: [site-obsigna/**, site/src/content/docs/blog/**, site/public/blog/**, sdk/go/**, web-verifier/**, scripts/build-verify-wasm.sh]
  # Manual rebuild — e.g. to resync the blog mirror after a missed trigger.
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys per ref so a slower older run can't finish last and
# overwrite obsigna.dev with stale output.
concurrency:
  group: site-obsigna-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site-obsigna

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The /verify page ships a WebAssembly verifier compiled from the Go verify
      # core. It is built fresh from source here (never committed) so the
      # deployed binary always matches the verifier the CLI<->WASM gate checks.
      - name: Setup Go (for the /verify WASM verifier)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pin to the patch recorded in web-verifier/go.mod (ADR-0035) so the
          # deployed verifier WASM does not silently change on a 1.26.x release.
          go-version-file: web-verifier/go.mod

      - name: Build /verify WASM verifier
        run: bash "$GITHUB_WORKSPACE/scripts/build-verify-wasm.sh"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (for mermaid rendering)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm build

      - name: Deploy to obsigna-site gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.OBSIGNA_SITE_DEPLOY_PAT }}
          external_repository: agent-receipts/obsigna-site
          publish_dir: site-obsigna/dist
          cname: obsigna.dev
