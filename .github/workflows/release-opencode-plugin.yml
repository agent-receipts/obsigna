name: "Release: opencode-plugin"

on:
  push:
    tags:
      - "opencode-plugin-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      # registry-url sets up the `.npmrc` registry entry; with no token provided
      # and id-token: write granted, npm publishes via OIDC trusted publishing
      # (configured on the npm package). Mirrors release-sdk-ts.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: integrations/opencode-plugin/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Prepare version
        run: |
          VERSION="${GITHUB_REF_NAME#opencode-plugin-v}"
          echo "PLUGIN_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify release tag matches package.json version
        working-directory: integrations/opencode-plugin
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Release tag opencode-plugin-v${PLUGIN_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Install plugin deps
        working-directory: integrations/opencode-plugin
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: integrations/opencode-plugin
        run: pnpm run typecheck

      - name: Lint
        working-directory: integrations/opencode-plugin
        run: pnpm run lint

      - name: Build
        working-directory: integrations/opencode-plugin
        run: pnpm run build

      - name: Test
        working-directory: integrations/opencode-plugin
        run: pnpm run test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mark pre-release tags (e.g. v0.1.0-alpha.1) so they don't show up as
          # "latest" on the GitHub Releases page. Skip creation if the release
          # already exists so reruns after a failed publish step don't abort
          # before reaching npm.
          PRERELEASE_ARG=()
          if [[ "${PLUGIN_VERSION}" == *-* ]]; then
            PRERELEASE_ARG+=(--prerelease)
          fi
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "opencode-plugin ${PLUGIN_VERSION}" \
              --generate-notes \
              "${PRERELEASE_ARG[@]}"
          fi

      - name: Determine npm dist-tag
        id: dist_tag
        shell: bash
        run: |
          CORE="${PLUGIN_VERSION%%+*}"
          if [[ "$CORE" == *-* ]]; then
            PRE="${CORE#*-}"
            if [[ "$PRE" =~ ^([A-Za-z]+) ]]; then
              TAG_NAME="${BASH_REMATCH[1],,}"
            else
              TAG_NAME="prerelease"
            fi
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Publishes via npm OIDC trusted publishing (configured on the npm
      # package): id-token: write + setup-node's registry-url, no token. npm
      # attempts OIDC first and mints a short-lived credential, signing
      # provenance from it. Same as release-sdk-ts.yml.
      - name: Publish to npm
        working-directory: integrations/opencode-plugin
        run: npm publish --access public --provenance --tag ${{ steps.dist_tag.outputs.tag }}
