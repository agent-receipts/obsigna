version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /site-obsigna
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    groups:
      go:
        patterns:
          - "*"
    # Internal modules are version-managed by the release cascade and wired
    # locally via go.work; Dependabot bumping their pins (often to alpha tags)
    # is noise. Third-party deps still update normally.
    ignore:
      - dependency-name: "github.com/agent-receipts/ar/*"

  - package-ecosystem: gomod
    directory: /mcp-proxy
    schedule:
      interval: weekly
    groups:
      go:
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/agent-receipts/ar/*"

  - package-ecosystem: gomod
    directory: /cross-sdk-tests
    schedule:
      interval: weekly
    groups:
      go:
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/agent-receipts/ar/*"

  - package-ecosystem: uv
    directory: /sdk/py
    schedule:
      interval: weekly
    groups:
      uv:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
